<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button id="menu" class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
    <a class="brand" href="#/"><span class="coin" aria-hidden="true"></span>MBA Calculators</a>

      <label class="sr-only" for="search">Search calculators</label>
      <input id="search" type="search" placeholder="Search calculators" autocomplete="off">
      <kbd class="hint" aria-hidden="true">/</kbd>
    </div>
    <label class="currency">
      <span>Currency</span>
      <select id="currency">
        <option value="$">$</option>

        <option value="₹">₹</option>
        <option value="¥">¥</option>
        <option value="">None</option>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Calculators"></nav>
