<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MBA Calculators</title>
  <meta name="description" content="Free calculators for finance, accounting, operations, optimization, economics, marketing and statistics. Every result shows its formula.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231f4e79'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3E%25%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button id="menu" class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false">Menu</button>
    <a class="brand" href="#/">MBA Calculators</a>
    <div class="search-wrap">
      <label class="sr-only" for="search">Search calculators</label>
      <input id="search" type="search" placeholder="Search calculators" autocomplete="off">
      <kbd class="hint" aria-hidden="true">/</kbd>
    </div>
    <label class="currency">
      <span>Currency</span>
      <select id="currency">
        <option value="$">$</option>
        <option value="€">€</option>
        <option value="£">£</option>
        <option value="₹">₹</option>
        <option value="¥">¥</option>
        <option value="">None</option>
      </select>
    </label>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Calculators"></nav>
    <main id="main" tabindex="-1">
      <noscript><p>This site needs JavaScript to run the calculators.</p></noscript>
    </main>
  </div>

  <footer class="footer">
    <p>Results are for study and estimation. Check important decisions against your own models. All calculations run in your browser.</p>
  </footer>

  <script src="js/lib.js"></script>
  <script src="js/calcs/finance.js"></script>
  <script src="js/calcs/accounting.js"></script>
  <script src="js/calcs/operations.js"></script>
  <script src="js/calcs/optimization.js"></script>
  <script src="js/calcs/economics.js"></script>
  <script src="js/calcs/marketing.js"></script>
  <script src="js/calcs/statistics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
